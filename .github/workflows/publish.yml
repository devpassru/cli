name: Publish to npm

on:
  push:
    tags:
      - "*-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      package:
        description: "Имя каталога пакета в packages/ (например, rundeploy)"
        required: true
        default: "rundeploy"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build & verify
        run: |
          bun run build
          bun run check

      - name: Resolve package and verify version
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKG_DIR="${{ github.event.inputs.package }}"
          else
            TAG="${GITHUB_REF_NAME}"
            PKG_DIR="${TAG%-v*}"
            TAG_VERSION="${TAG##*-v}"
          fi

          if [ ! -f "packages/${PKG_DIR}/package.json" ]; then
            echo "Package directory packages/${PKG_DIR} not found"
            exit 1
          fi

          PKG_VERSION=$(PKG_DIR="$PKG_DIR" node -p "require('./packages/' + process.env.PKG_DIR + '/package.json').version")
          if [ -n "${TAG_VERSION:-}" ] && [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version (${TAG_VERSION}) does not match package.json version (${PKG_VERSION})"
            exit 1
          fi

          echo "dir=packages/${PKG_DIR}" >> "$GITHUB_OUTPUT"
          echo "name=$(PKG_DIR="$PKG_DIR" node -p "require('./packages/' + process.env.PKG_DIR + '/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
